<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASSG Composite Guardian</title><style>body{margin:0;background:#07111e;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}#m{padding:24px;text-align:center}</style></head><body><div id="m">Loading TASSG Composite Guardian…</div><script>(async()=>{const files=['app/part01.txt', 'app/part02.txt', 'app/part03.txt', 'app/part04.txt', 'app/part05.txt', 'app/part06.txt', 'app/part07.txt', 'app/part08.txt', 'app/part09.txt', 'app/part10.txt', 'app/part11.txt'];try{let html='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);html+=await r.text()}document.open();document.write(html);document.close()}catch(e){document.getElementById('m').innerHTML='<h2>Unable to load the training app</h2><p>'+e.message+'</p>'}})();</script></body></html>
